<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>TodoList</title>
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>
    <header class="header">
        <div class="container header-content">
            <a
                href="#"
                class="logo"
            >
                TodoList
            </a>
            <p class="greeting">
                Bom dia,
                <strong>Tayson Silva</strong> 👋
            </p>
        </div>
    </header>
    <main class="container main-content">
        <section class="add-section">
            <h1>
                Adicionar tarefas
            </h1>
            <form
                id="taskForm"
                class="add-form"
            >
                <input
                    id="taskInput"
                    type="text"
                    placeholder="Nome da tarefa"
                    autocomplete="off"
                    maxlength="100"
                >
                <button type="submit">
                    Adicionar
                </button>
            </form>
        </section>
        <div class="divider"></div>
        <section class="tasks-section">
            <div class="tasks-header">
                <div>
                    <h2>
                        Minhas tarefas
                    </h2>
                    <p>
                        Veja todas as suas tarefas
                        criadas na plataforma.
                    </p>
                </div>
                <p
                    id="counter"
                    class="counter"
                >
                    0 de 0
                    <span>
                        concluídas
                    </span>
                </p>
            </div>

            <div
                id="taskList"
                class="task-list"
            ></div>

            <p
                id="emptyState"
                class="empty-state"
            >
                Nenhum registro encontrado.
            </p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
